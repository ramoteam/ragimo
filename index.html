<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>Ragimo</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--tg-theme-bg-color,#f5f5f5); color:var(--tg-theme-text-color,#111); }
    main { width:100%; max-width:none; margin:0; padding:0 0 82px; }
    .logo { display:none; }
    .sub { display:none; }
    .card { margin-top:18px; padding:20px; border-radius:24px; background:var(--tg-theme-secondary-bg-color,#fff); }
    .avatar { width:68px;height:68px;border-radius:20px;display:grid;place-items:center;background:#111;color:#fff;font-size:30px;font-weight:800; }
    .name { font-size:25px;font-weight:800;margin-top:14px; }
    .username { opacity:.55;margin-top:3px; }
    .stats { display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px; }
    .stat { padding:13px 8px;border-radius:16px;background:var(--tg-theme-bg-color,#f5f5f5);text-align:center; }
    .num { font-size:21px;font-weight:800; }.label { font-size:11px;opacity:.55; }
    .loading{text-align:center;padding:34px 0;opacity:.65}.error{text-align:center;padding:28px 0;color:#b42318}
    .map { position:relative;height:calc(100vh - 82px);height:calc(100dvh - 82px);overflow:hidden;border-radius:0;margin:0;background:#dfe8d5;box-shadow:none; }
    .map:before { content:"";position:absolute;inset:-30%;transform:rotate(-7deg);background:repeating-linear-gradient(22deg,transparent 0 58px,rgba(255,255,255,.75) 59px 66px); }
    .map:after { content:"";position:absolute;width:120%;height:75px;left:-10%;top:125px;background:rgba(151,190,215,.72);transform:rotate(-12deg);border-radius:50%; }
    .road{position:absolute;background:rgba(255,255,255,.9);border-radius:99px;z-index:1}.road.one{width:120%;height:13px;top:72px;left:-10%;transform:rotate(18deg)}.road.two{width:100%;height:11px;top:235px;left:0;transform:rotate(-24deg)}
    .player{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:25px;height:25px;border-radius:50%;background:#111;border:5px solid #fff;z-index:4;box-shadow:0 3px 12px rgba(0,0,0,.25)}
    .creature{position:absolute;z-index:5;width:58px;height:58px;border-radius:20px;display:grid;place-items:center;font-size:31px;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.16);border:0;cursor:pointer}.creature.a{left:18%;top:25%}.creature.b{right:14%;top:55%}
    .map-label{position:absolute;z-index:6;left:14px;top:14px;padding:7px 10px;border-radius:12px;background:rgba(255,255,255,.88);font-size:12px;font-weight:700}
    .hint{margin-top:10px;font-size:13px;opacity:.62;text-align:center}
    .section-title{font-size:22px;font-weight:800}.collection-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
    .creature-card{padding:18px;border-radius:20px;background:var(--tg-theme-secondary-bg-color,#fff);text-align:center}.creature-emoji{font-size:46px}.creature-name{font-weight:800;margin-top:8px}.rarity{font-size:12px;opacity:.55;margin-top:3px}
    .empty{text-align:center;padding:36px 10px;opacity:.6}
    .hidden{display:none!important}
    .nav{position:fixed;left:0;right:0;bottom:0;width:100%;height:82px;padding:7px 12px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-radius:0;background:var(--tg-theme-secondary-bg-color,#fff);box-shadow:0 -4px 18px rgba(0,0,0,.14);border-top:1px solid rgba(0,0,0,.08);z-index:1500}
    .nav button{border:0;background:transparent;color:inherit;padding:12px 4px;border-radius:18px;font-weight:800;font-size:13px}.nav button.active{background:var(--tg-theme-bg-color,#f5f5f5);box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:grid;place-items:end center;padding:16px;z-index:2000}.sheet{width:min(520px,100%);padding:24px;border-radius:28px;background:var(--tg-theme-secondary-bg-color,#fff);text-align:center}.sheet-emoji{font-size:72px}.sheet h2{margin:8px 0 4px}.sheet p{margin:0 0 18px;opacity:.62}.primary{width:100%;border:0;border-radius:16px;padding:14px;background:#111;color:#fff;font-size:16px;font-weight:800}.secondary{width:100%;border:0;background:transparent;color:inherit;padding:12px;font-weight:700}
  </style>
</head>
<body>
  <main>
    <div class="logo">Ragimo 🌍✨</div>
    <div class="sub">Explore. Collect. Discover.</div>
    <div id="screen"></div>
  </main>

  <div id="modal" class="modal hidden"></div>

  <nav class="nav">
    <button class="active" data-screen="map">🗺️ Map</button>
    <button data-screen="collection">📚 Collection</button>
    <button data-screen="profile">👤 Profile</button>
  </nav>

  <script>
    const API_URL="https://ucrdzeveifycwsvneuhs.supabase.co/functions/v1/ragimo-mini-app";
    const tg=window.Telegram&&window.Telegram.WebApp;
    const screen=document.getElementById("screen");
    const modal=document.getElementById("modal");
    let user=null;

    if(tg){tg.ready();tg.expand();}

    function esc(v){return String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
    async function api(action, extra={}){
      if(!tg||!tg.initData) throw new Error("Open Ragimo from Telegram.");
      const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg.initData,action,...extra})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||"Request failed");
      return d;
    }

    function renderProfile(){
      const initial=(user.display_name||user.first_name||"R").trim().charAt(0).toUpperCase();
      const name=user.display_name||user.first_name||"Ragimo Player";
      const username=user.username?"@"+user.username:"Ragimo Explorer";
      screen.innerHTML='<div class="card"><div class="avatar">'+esc(initial)+'</div><div class="name">'+esc(name)+'</div><div class="username">'+esc(username)+'</div><div class="stats">'+
        '<div class="stat"><div class="num">'+(Number(user.level)||1)+'</div><div class="label">LEVEL</div></div>'+
        '<div class="stat"><div class="num">'+(Number(user.xp)||0)+'</div><div class="label">XP</div></div>'+
        '<div class="stat"><div class="num">'+(Number(user.coins)||0)+'</div><div class="label">COINS</div></div></div></div>';
    }

    async function renderMap(){
      screen.innerHTML='<div id="real-map" class="map"></div>';
      const map=L.map("real-map",{zoomControl:false}).setView([51.45,7.02],13);
      L.control.zoom({position:"bottomright"}).addTo(map);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);

      const spawnPoints=[
        [0.0021,0.0018],[0.0012,-0.0022],[-0.0019,0.0025],[0.0027,-0.0015],
        [-0.0025,-0.0012],[-0.0010,0.0030]
      ];
      const catalog=[
        {slug:"leafy",name:"Leafy",emoji:"🌱"},
        {slug:"flamio",name:"Flamio",emoji:"🔥"}
      ];

      const showSpawns=(lat,lng)=>{
        L.circleMarker([lat,lng],{radius:9,color:"#111",weight:3,fillColor:"#fff",fillOpacity:1}).addTo(map).bindTooltip("You");
        spawnPoints.forEach((p,i)=>{
          const c=catalog[Math.floor(Math.random()*catalog.length)];
          const marker=L.marker([lat+p[0],lng+p[1]],{
            icon:L.divIcon({className:"ragimo-marker",html:'<div style="width:52px;height:52px;border-radius:18px;background:white;box-shadow:0 5px 16px rgba(0,0,0,.2);display:grid;place-items:center;font-size:30px;border:2px solid rgba(0,0,0,.08)">'+c.emoji+'</div>',iconSize:[52,52],iconAnchor:[26,26]})
          }).addTo(map);
          marker.on("click",()=>openCreature(c.slug,c.name,c.emoji));
        });
      };

      if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(
          pos=>{const lat=pos.coords.latitude,lng=pos.coords.longitude;map.setView([lat,lng],15);showSpawns(lat,lng);},
          ()=>showSpawns(51.45,7.02),
          {enableHighAccuracy:false,maximumAge:300000,timeout:6000}
        );
      }else showSpawns(51.45,7.02);
    }

    async function renderCollection(){
      screen.innerHTML='<div class="card"><div class="section-title">Your Collection</div><div class="loading">Loading collection…</div></div>';
      try{
        const d=await api("collection");
        user=d.user;
        if(!d.collection.length){
          screen.innerHTML='<div class="card"><div class="section-title">Your Collection</div><div class="empty">Nothing caught yet.<br>Go to the map and find your first Ragimo! 🌱</div></div>';
          return;
        }
        const cards=d.collection.map(x=>'<div class="creature-card"><div class="creature-emoji">'+esc(x.creature.emoji)+'</div><div class="creature-name">'+esc(x.creature.name)+'</div><div class="rarity">'+esc(x.creature.rarity)+'</div></div>').join("");
        screen.innerHTML='<div class="card"><div class="section-title">Your Collection</div><div class="collection-grid">'+cards+'</div></div>';
      }catch(e){screen.innerHTML='<div class="card error">'+esc(e.message)+'</div>';}
    }

    function openCreature(slug,name,emoji){
      modal.innerHTML='<div class="sheet"><div class="sheet-emoji">'+esc(emoji)+'</div><h2>'+esc(name)+'</h2><p>A wild Ragimo is nearby.</p><button class="primary" id="capture">✨ Catch '+esc(name)+'</button><button class="secondary" id="close">Close</button></div>';
      modal.classList.remove("hidden");
      document.getElementById("close").onclick=()=>modal.classList.add("hidden");
      document.getElementById("capture").onclick=async()=>{
        const btn=document.getElementById("capture");btn.disabled=true;btn.textContent="Catching…";
        try{
          const d=await api("capture",{slug});
          modal.classList.add("hidden");
          user=d.user;
          if(d.alreadyOwned){
            if(tg&&tg.showAlert)tg.showAlert(name+" is already in your collection.");
          }else{
            if(tg&&tg.showAlert)tg.showAlert("✨ "+name+" was caught! +10 XP · +5 coins");
          }
          setActive("collection"); await renderCollection();
        }catch(e){
          btn.disabled=false;btn.textContent="✨ Catch "+name;
          if(tg&&tg.showAlert)tg.showAlert(e.message); else alert(e.message);
        }
      };
    }

    function setActive(name){
      document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.screen===name));
    }

    document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",async()=>{
      const s=b.dataset.screen;setActive(s);
      try{
        if(s==="map")renderMap();
        else if(s==="profile")renderProfile();
        else await renderCollection();
      }catch(e){screen.innerHTML='<div class="card error">'+esc(e.message)+'</div>';}
    }));

    async function start(){
      screen.innerHTML='<div class="card loading">Loading Ragimo…</div>';
      try{const d=await api("profile");user=d.user;renderMap();}
      catch(e){screen.innerHTML='<div class="card error">'+esc(e.message)+'</div>';}
    }
    setInterval(()=>{
      const active=document.querySelector('.nav button.active');
      if(active&&active.dataset.screen==="map") renderMap();
    },60000);

    start();
  </script>
</body>
</html>
