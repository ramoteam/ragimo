<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>Ragimo</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--tg-theme-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #111);
    }
    main { max-width: 520px; margin: auto; padding: 28px 18px; }
    .logo { font-size: 34px; font-weight: 900; letter-spacing: -1px; }
    .sub { opacity: .65; margin-top: 4px; }
    .card {
      margin-top: 22px; padding: 22px; border-radius: 24px;
      background: var(--tg-theme-secondary-bg-color, #fff);
    }
    .avatar {
      width: 68px; height: 68px; border-radius: 20px; display: grid;
      place-items: center; background: #111; color: #fff;
      font-size: 30px; font-weight: 800;
    }
    .name { font-size: 25px; font-weight: 800; margin-top: 16px; }
    .username { opacity: .55; margin-top: 3px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 22px; }
    .stat {
      padding: 14px 10px; border-radius: 16px;
      background: var(--tg-theme-bg-color, #f5f5f5); text-align: center;
    }
    .num { font-size: 22px; font-weight: 800; }
    .label { font-size: 12px; opacity: .55; }
    .loading { text-align: center; padding: 40px 0; opacity: .65; }
    .error { text-align: center; padding: 30px 0; color: #b42318; }
    .map { position: relative; height: 310px; overflow: hidden; border-radius: 24px; margin-top: 22px;
      background: #dfe8d5; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
    .map:before { content: ""; position: absolute; inset: -30%; transform: rotate(-7deg);
      background: repeating-linear-gradient(22deg, transparent 0 58px, rgba(255,255,255,.75) 59px 66px); }
    .map:after { content: ""; position: absolute; width: 120%; height: 75px; left: -10%; top: 125px;
      background: rgba(151,190,215,.72); transform: rotate(-12deg); border-radius: 50%; }
    .road { position:absolute; background:rgba(255,255,255,.9); border-radius:99px; z-index:1; }
    .road.one { width:120%; height:13px; top:72px; left:-10%; transform:rotate(18deg); }
    .road.two { width:100%; height:11px; top:235px; left:0; transform:rotate(-24deg); }
    .player { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:25px;height:25px;
      border-radius:50%; background:#111; border:5px solid #fff; z-index:4; box-shadow:0 3px 12px rgba(0,0,0,.25); }
    .creature { position:absolute; z-index:5; width:58px;height:58px;border-radius:20px;display:grid;place-items:center;
      font-size:31px; background:#fff; box-shadow:0 6px 18px rgba(0,0,0,.16); border:0; cursor:pointer; }
    .creature.a { left:18%; top:25%; } .creature.b { right:14%; top:55%; }
    .map-label { position:absolute; z-index:6; left:14px; top:14px; padding:7px 10px;border-radius:12px;
      background:rgba(255,255,255,.88);font-size:12px;font-weight:700; }
    .hint { margin-top:12px; font-size:13px; opacity:.62; text-align:center; }
    .nav { position:fixed; left:12px; right:12px; bottom:12px; max-width:496px; margin:auto;
      display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:8px; border-radius:20px;
      background:var(--tg-theme-secondary-bg-color,#fff); box-shadow:0 8px 30px rgba(0,0,0,.12); }
    .nav button { border:0; background:transparent; color:inherit; padding:10px 4px; border-radius:14px; font-weight:700; }
    .nav button.active { background:var(--tg-theme-bg-color,#f5f5f5); }
    .spacer { height:82px; }
  </style>
</head>
<body>
  <main>
    <div class="logo">Ragimo 🌍✨</div>
    <div class="sub">Explore. Collect. Discover.</div>
    <div id="app" class="card"><div class="loading">Loading your profile…</div></div>
    <div class="map">
      <div class="map-label">📍 Nearby</div>
      <div class="road one"></div><div class="road two"></div>
      <div class="player"></div>
      <button class="creature a" data-creature="Leafy">🌱</button>
      <button class="creature b" data-creature="Flamio">🔥</button>
    </div>
    <div class="hint">Tap a nearby Ragimo to inspect it.</div>
    <div class="spacer"></div>
    <nav class="nav">
      <button class="active">🗺️ Map</button><button>📚 Collection</button><button>👤 Profile</button>
    </nav>
  </main>

  <script>
    const API_URL = "https://ucrdzeveifycwsvneuhs.supabase.co/functions/v1/ragimo-mini-app";
    const tg = window.Telegram && window.Telegram.WebApp;
    const app = document.getElementById("app");

    if (tg) {
      tg.ready();
      tg.expand();
    }

    function esc(value) {
      return String(value).replace(/[&<>"]/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"
      }[c]));
    }

    async function load() {
      try {
        if (!tg || !tg.initData) {
          throw new Error("Open Ragimo from Telegram.");
        }

        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData: tg.initData })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Unable to load profile.");

        const u = data.user;
        const initial = (u.display_name || u.first_name || "R").trim().charAt(0).toUpperCase();
        const name = u.display_name || u.first_name || "Ragimo Player";
        const username = u.username ? "@" + u.username : "Ragimo Explorer";

        app.innerHTML =
          '<div class="avatar">' + esc(initial) + '</div>' +
          '<div class="name">' + esc(name) + '</div>' +
          '<div class="username">' + esc(username) + '</div>' +
          '<div class="stats">' +
            '<div class="stat"><div class="num">' + (Number(u.level) || 1) + '</div><div class="label">LEVEL</div></div>' +
            '<div class="stat"><div class="num">' + (Number(u.xp) || 0) + '</div><div class="label">XP</div></div>' +
            '<div class="stat"><div class="num">' + (Number(u.coins) || 0) + '</div><div class="label">COINS</div></div>' +
          '</div>';
      } catch (error) {
        app.innerHTML = '<div class="error">' + esc(error.message) + '</div>';
      }
    }

    document.querySelectorAll(".creature").forEach(button => {
      button.addEventListener("click", () => {
        const name = button.dataset.creature;
        if (tg && tg.showAlert) tg.showAlert(name + " is nearby! Capture system coming next.");
        else alert(name + " is nearby!");
      });
    });

    load();
  </script>
</body>
</html>
